name: private-mesh-saga-test

services:
  postgres:
    image: postgres:18
    container_name: private-mesh-saga-postgres
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      - "15432:5432"
    volumes:
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 3s

  mesh-x:
    image: node:24
    working_dir: /app
    command: node scripts/mesh-node-server.mjs
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
      HOST: 0.0.0.0
      PORT: 3001
      PRIVATE_MESH_NODE_ID: "0x1000000000000000000000000000000000000001"
      PRIVATE_MESH_PUBLIC_KEY: "0x1000000000000000000000000000000000000001"
      PRIVATE_MESH_ENABLE_LOGGING: "1"
      PRIVATE_MESH_LONG_POLL_TIMEOUT_MS: "1000"
      PRIVATE_MESH_MST_INTERVAL_MS: "250"
    ports:
      - "3001:3001"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy

  mesh-y:
    image: node:24
    working_dir: /app
    command: node scripts/mesh-node-server.mjs
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
      HOST: 0.0.0.0
      PORT: 3002
      PRIVATE_MESH_NODE_ID: "0x2000000000000000000000000000000000000002"
      PRIVATE_MESH_PUBLIC_KEY: "0x2000000000000000000000000000000000000002"
      PRIVATE_MESH_ENABLE_LOGGING: "1"
      PRIVATE_MESH_LONG_POLL_TIMEOUT_MS: "1000"
      PRIVATE_MESH_MST_INTERVAL_MS: "250"
    ports:
      - "3002:3002"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy

name: private-mesh-local

services:
  postgres:
    image: postgres:18
    container_name: private-mesh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      - "${PRIVATE_MESH_POSTGRES_PORT:-5432}:5432"
    volumes:
      - private-mesh-postgres-18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  private-mesh-postgres-18:
